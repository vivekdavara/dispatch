server:
  port: ${DISPATCH_PORT:8101}

spring:
  application:
    name: dispatch
  # Errors (ours and Spring's: validation, bad JSON, missing headers) as RFC 9457 application/problem+json.
  mvc:
    problemdetails:
      enabled: true
  # Local default: the Homebrew Postgres 14 on 5432 with the OS user. CI overrides these through
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/dispatch
    username: ${USER:postgres}
    password: ""
  flyway:
    locations: classpath:db/migration
  # Project-local Redis (redis-server --port 6381); live courier positions only, never the source of truth.
  data:
    redis:
      host: localhost
      port: 6381
      timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        # metrics: engine pass timings (dispatch.pass, dispatch.pass.orders) for the simulator's report.
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

dispatch:
  locations:
    # A courier with no location ping for this long counts as disconnected and drops out of candidates.
    fresh-for: 60s
  assignment:
    max-pickup-km: 5.0
    # One engine pass looks at this many of a zone's oldest pending orders and serves them by priority score.
    pending-batch: 200
    # Read the zone's AVAILABLE couriers once per pass instead of once per pending order, and stop the pass when
    # none are left. false runs the original pass (README, "Results" has both measured).
    candidate-snapshot: true
  offers:
    # An offer not accepted or declined within this long expires: the order goes back to PENDING for another
    # courier, and this courier is never offered that order again.
    timeout: 30s
  loop:
    # Event-driven passes: order created, courier available, offer declined/expired, delivery done.
    enabled: true
    # Passes over different zones run in parallel; one zone never has two at once.
    threads: 4
    # How often overdue offers are expired (each expiry triggers a pass for its zone).
    expiry-interval: 1s
    # Safety net: zones with pending orders get a pass this often even without an event (a courier driving into
    # range sends only location pings, which don't trigger passes).
    sweep-interval: 5s
  sockets:
    # A courier whose socket closes gets this long to reconnect (and is resent their open offer if they do). After
    # that they're taken offline and an offer they held goes straight to the next courier, instead of waiting out
    # the 30 s offer timeout.
    reconnect-grace: 10s
